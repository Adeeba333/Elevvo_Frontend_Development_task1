<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>toBATO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" data-sidebar="open">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar__inner">
            <div class="sidebar__head">
                <img class="logo" src="images\logo1.png" alt="toBATO" width="40" height="40">
                <span class="brand">toBATO.to</span>
                <button class="collapse" type="button" data-sidebar-toggle aria-controls="sidebar" aria-expanded="true" aria-label="Close sidebar">&lsaquo;</button>
            </div>
            <nav class="nav" aria-label="Main">
                <a href="#" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span>Dashboard</span></a>
                <a href="#"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span>Currently reading</span></a>
                <a href="#"><svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg><span>To be read</span></a>
                <a href="#"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span>Settings</span></a>
                <a href="#"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></a>
            </nav>
        </div>
    </aside>
    <div class="scrim" data-sidebar-toggle></div>

    <div class="main">
        <header class="topbar">
            <button class="menu" type="button" data-sidebar-toggle aria-controls="sidebar" aria-expanded="false" aria-label="Open sidebar"><span></span></button>
            <span class="brand">toBATO.to</span>
        </header>
        <main class="content">
            <h1>Dashboard</h1>
        <div class="cards">
            <a class="card" href="#" style="--img:url(images/tobatomanga.jpg)"><span class="card__banner"></span><span class="card__label">Manga</span></a>
            <a class="card" href="#" style="--img:url(images/tobatomanhwa.jpg)"><span class="card__banner"></span><span class="card__label">Manhwa</span></a>
            <a class="card" href="#" style="--img:url(images/tobatomanhua.jpg)"><span class="card__banner"></span><span class="card__label">Manhua</span></a>
            <a class="card" href="#" style="--img:url(images/tobatowebtoon.jpg)"><span class="card__banner"></span><span class="card__label">Webtoon</span></a>
            <a class="card" href="#" style="--img:url(images/tobatowebnovels.jpg)"><span class="card__banner"></span><span class="card__label">Webnovel</span></a>
            <a class="card" href="#" style="--img:url(images/tobatonovels.jpg)"><span class="card__banner"></span><span class="card__label">Novel</span></a>
        </div>
        </main>
    </div>
</div>

<footer>&copy; 2026 toBATO|Mahmuda Adeeba Tul Husna</footer>
<script src="script.js"></script>
</body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M18 18h2"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
</svg>
</html>
